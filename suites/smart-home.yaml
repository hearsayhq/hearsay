suite: smart-home
description: Ships flawed by default (HEARSAY_FIXED=0). The demo runs it red, then green.
server:
  url: http://localhost:4102/mcp
  start: npm run server:smart-home
orchestrator: scripted
checks:
  - protocol.version
  - protocol.refusal_as_result
  - lint.tool_names
  - lint.destructive_annotated
  - latency.tool
  - latency.first_audio
  - speak.length
  - speak.no_structured_dump
  - consent.path
  - consent.decline_holds
  - consent.states_details
cases:
  - id: living-room-off
    say: turn off everything in the living room
    expect:
      tool: set_scene
      args: { room: living_room, state: "off" }
      argsMustNotContain: { room: all }
    fuzz: [asr.compound_split]
    checks: [asr.robust]

  - id: whole-home-off-needs-confirmation
    say: turn off the whole house
    human: { answer: decline }
    expect:
      tool: set_scene
      args: { room: all, state: "off" }
      confirm: required
      spokenIncludes: [okay]

  - id: dim-bedroom
    say: dim the bedroom to thirty percent
    expect:
      tool: set_scene
      args: { room: bedroom, brightness: 30 }
    fuzz: [asr.number_confusion]
    checks: [asr.robust]
