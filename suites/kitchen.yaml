suite: kitchen
description: The reference server that should pass everything.
server:
  url: http://localhost:4101/mcp
  start: npm run server:kitchen
orchestrator: scripted
checks:
  - protocol.version
  - protocol.refusal_as_result
  - lint.tool_names
  - lint.descriptions
  - lint.schema_constraints
  - lint.destructive_annotated
  - lint.error_actionable
  - latency.tool
  - latency.first_audio
  - speak.length
  - speak.no_structured_dump
cases:
  - id: start-pasta-timer
    say: set a pasta timer for fifteen minutes
    expect:
      tool: timer_start
      args: { minutes: 15, label: pasta }
      spokenIncludes: [pasta, fifteen]
    # "fifty minutes" is a different timer; Kitchen passes asr.robust by reading the duration back.
    fuzz: [asr.number_confusion, asr.homophones]
    checks: [asr.robust]

  - id: start-egg-timer
    say: set an egg timer for seven minutes
    expect:
      tool: timer_start
      args: { minutes: 7, label: egg }

  - id: list-timers
    say: how long is left on my timers
    after: [start-pasta-timer, start-egg-timer]
    expect:
      tool: timer_list
      spokenIncludes: [pasta, egg]
    checks: [speak.lists]

  - id: cancel-ambiguous
    say: cancel the timer
    after: [start-pasta-timer, start-egg-timer]
    call: { tool: timer_cancel, args: {} }
    expect:
      tool: timer_cancel
      spokenIncludes: [which]
