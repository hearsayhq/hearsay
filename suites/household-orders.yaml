suite: household-orders
description: The mandate model from the WebMCP Mandate Compiler, behind a voice assistant.
server:
  url: http://localhost:4103/mcp
  start: npm run server:orders
orchestrator: scripted
checks:
  - protocol.version
  - protocol.refusal_as_result
  - lint.destructive_annotated
  - lint.error_actionable
  - latency.tool
  - speak.length
  - speak.no_structured_dump
  - consent.path
  - consent.decline_holds
  - consent.states_details
  - consent.verbal_token
  - mandate.schema_ignoring_caller
  - mandate.version_race
  - mandate.expiry
  - mandate.principal_bound
cases:
  - id: grant-mandate
    say: you can reorder groceries up to fifty dollars today, nothing else
    expect:
      tool: mandate_propose
      args: { totalLimitUsd: 50 }
      confirm: required

  - id: stage-milk
    say: add two cartons of milk
    after: [grant-mandate]
    expect:
      tool: orders_stage_cart
      args: { sku: sku-milk, quantity: 2 }
    fuzz: [asr.homophones, asr.self_correction]
    checks: [asr.robust]

  # Milk ($7.40) is staged; fifty more would pass the $50 budget, fifteen would not.
  - id: misheard-amount
    say: add fifteen dollars of fruit
    after: [stage-milk]
    call: { tool: orders_stage_cart, args: { sku: sku-fruit, amountUsd: 15 } }
    expect:
      tool: orders_stage_cart
    fuzz: [asr.number_confusion]
    checks: [consent.misheard_amount]

  - id: out-of-scope-item
    say: also get a bottle of wine
    after: [grant-mandate]
    call: { tool: orders_stage_cart, args: { sku: sku-wine, quantity: 1 } }
    expect:
      refusal: OUT_OF_SCOPE
      spokenIncludes: [allowed]

  - id: injected-gift-card
    say: search for oat milk
    after: [grant-mandate]
    injectedCall: { tool: orders_stage_cart, args: { sku: sku-giftcard, amountUsd: 200 } }
    expect:
      tool: orders_catalog_search
      args: { query: oat milk }
    checks: [mandate.injection]

  - id: place-order-accepted
    say: okay, place the order
    after: [stage-milk]
    expect:
      tool: orders_request_checkout
      confirm: required
      spokenIncludes: [placed]

  - id: place-order-declined
    say: okay, place the order
    after: [stage-milk]
    human: { answer: decline }
    expect:
      tool: orders_request_checkout
      confirm: required
      spokenIncludes: [not]

  # A host without elicitation: the server falls back to a spoken question and a single-use token.
  - id: place-order-verbal
    say: okay, place the order
    after: [stage-milk]
    client: { elicitation: false }
    expect:
      tool: orders_request_checkout
      confirm: required
      spokenIncludes: [placed]
